<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StartSelect</title>
<meta name="description" content="StartSelect: canal de YouTube Shorts sobre games — retro, GTA VI, PS5 e Nintendo Switch 2.">
<link rel="icon" href="logo.png">
<style>
  :root { --bg: #0e0718; --fg: #f4ecff; --muted: #c4b3dd; --rosa: #ff2fa8; --ciano: #33d6ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(circle at 50% 0%, #2a0f45 0%, var(--bg) 60%); color: var(--fg);
         font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }
  main { max-width: 640px; margin: 0 auto; padding: 56px 16px 40px; text-align: center; }
  img { width: 160px; height: 160px; }
  h1 { font-size: 2.4rem; margin: 16px 0 4px; letter-spacing: -0.02em; }
  h1 span { color: var(--rosa); }
  .promessa { color: var(--muted); font-size: 1.1rem; margin: 0 0 28px; }
  .nichos { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 32px; padding: 0; list-style: none; }
  .nichos li { border: 1px solid #4a2a6b; border-radius: 999px; padding: 4px 14px; font-size: .95rem; }
  a.botao { display: inline-block; background: var(--rosa); color: #fff; text-decoration: none; font-weight: 600;
            padding: 12px 24px; border-radius: 10px; }
  footer { margin-top: 48px; font-size: .9rem; color: var(--muted); }
  footer a { color: var(--ciano); }
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="Logo do StartSelect">
  <h1>Start<span>Select</span></h1>
  <p class="promessa">Atenção nação gamer! Pegue um controle, um energético e senta para mais uma sessão de StartSelect.</p>
  <ul class="nichos">
    <li>🕹️ Retro Gaming</li><li>🌴 GTA VI</li><li>🎮 Novidades PS5</li><li>🍄 Novidades Switch 2</li>
  </ul>
  <a class="botao" href="https://www.youtube.com/@start.select.shorts">Assistir no YouTube</a>
  <footer>
    <p><a href="privacidade.html">Política de privacidade</a></p>
  </footer>
</main>
</body>
</html>
